<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Appointment Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>

    <style>
        body { background-color: #f8f9fc; font-family: "Segoe UI", system-ui, sans-serif; }
        .card { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; }
        .card-header { background: linear-gradient(90deg, #0d6efd 0%, #0b5ed7 100%); color: white; font-weight: 600; text-align: center; padding: 1.75rem; }
        .btn-book { background: #0d6efd; border: none; font-weight: 600; padding: 0.85rem 1.5rem; transition: all 0.2s; }
        .btn-book:hover { background: #0b5ed7; transform: translateY(-1px); }
        .form-label { font-weight: 500; }
        .form-label i { color: #0d6efd; width: 1.4em; text-align: center; }
        .invalid-feedback { display: block; }
        .loading { color: #6c757d; font-style: italic; }
    </style>
</head>

<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0"><i class="fas fa-hospital me-2"></i>Book Appointment</h3>
                </div>

                <div class="card-body p-4 p-md-5">

                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/appointments/book}" th:object="${appointmentDto}" method="post" id="bookingForm" novalidate>

                        <!-- Full Name -->
                        <div class="mb-4">
                            <label class="form-label">Patient Full Name</label>
                            <input type="text" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">

                            <div th:if="${#fields.hasErrors('fullName')}"
                                 th:errors="*{fullName}" class="invalid-feedback"></div>
                        </div>

                        <!-- Patient ID -->
                        <div class="mb-4">
                            <label class="form-label">Patient ID</label>
                            <input type="text" th:field="*{patientId}" class="form-control"
                                   th:classappend="${#fields.hasErrors('patientId')} ? 'is-invalid' : ''">

                            <div th:if="${#fields.hasErrors('patientId')}"
                                 th:errors="*{patientId}" class="invalid-feedback"></div>
                        </div>

                        <!-- Specialization -->
                        <div class="mb-4">
                            <label class="form-label">Specialization</label>
                            <select th:field="*{specialization}" class="form-select"
                                    th:classappend="${#fields.hasErrors('specialization')} ? 'is-invalid' : ''">
                                <option value="">-- Select Specialization --</option>
                                <option value="Cardiologist">Cardiologist</option>
                                <option value="Dermatologist">Dermatologist</option>
                                <option value="Neurologist">Neurologist</option>
                                <option value="Pediatrician">Pediatrician</option>
                                <option value="General Physician">General Physician</option>
                                <option value="Orthopedic">Orthopedic</option>
                            </select>

                            <div th:if="${#fields.hasErrors('specialization')}"
                                 th:errors="*{specialization}" class="invalid-feedback"></div>
                        </div>

                        <!-- Doctor -->
                        <div class="mb-4">
                            <label class="form-label">Doctor</label>
                            <select th:field="*{doctorId}" id="doctorId" class="form-select"
                                    th:classappend="${#fields.hasErrors('doctorId')} ? 'is-invalid' : ''">
                                <option value="">-- First select specialization --</option>
                            </select>

                            <div th:if="${#fields.hasErrors('doctorId')}"
                                 th:errors="*{doctorId}" class="invalid-feedback"></div>
                        </div>

                        <!-- Date -->
                        <div class="mb-4">
                            <label class="form-label">Date</label>
                            <input type="date" id="appointmentDateInput" class="form-control">
                            <div id="dateFeedback" class="invalid-feedback"></div>
                        </div>

                        <!-- Time -->
                        <div class="mb-4">
                            <label class="form-label">Time</label>
                            <select id="appointmentTime" class="form-select">
                                <option value="">Select Time</option>
                                <option value="10:00">10:00 AM</option>
                                <option value="11:00">11:00 AM</option>
                            </select>
                            <div id="timeFeedback" class="invalid-feedback"></div>
                        </div>

                        <input type="hidden" th:field="*{appointmentDate}" id="combinedDateTime"/>

                        <!-- Reason -->
                        <div class="mb-4">
                            <label class="form-label">Reason</label>
                            <select th:field="*{reason}" class="form-select"
                                    th:classappend="${#fields.hasErrors('reason')} ? 'is-invalid' : ''">
                                <option value="">Select</option>
                                <option value="CONSULTATION">Consultation</option>
                            </select>

                            <div th:if="${#fields.hasErrors('reason')}"
                                 th:errors="*{reason}" class="invalid-feedback"></div>
                        </div>

                        <button class="btn btn-book w-100">Submit</button>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function(){

    $('#bookingForm').submit(function(e){

        let valid = true;

        let date = $('#appointmentDateInput').val();
        let time = $('#appointmentTime').val();
        let doctor = $('#doctorId').val();

        if(!date){
            $('#dateFeedback').text('Please select date');
            $('#appointmentDateInput').addClass('is-invalid');
            valid = false;
        } else {
            $('#appointmentDateInput').removeClass('is-invalid');
        }

        if(!time){
            $('#timeFeedback').text('Please select time');
            $('#appointmentTime').addClass('is-invalid');
            valid = false;
        } else {
            $('#appointmentTime').removeClass('is-invalid');
        }

        if(!doctor){
            $('#doctorId').addClass('is-invalid');
            valid = false;
        } else {
            $('#doctorId').removeClass('is-invalid');
        }

        if(!valid){
            e.preventDefault();
            return false;
        }

        $('#combinedDateTime').val(date + 'T' + time);
    });

});
</script>

</body>
</html>
