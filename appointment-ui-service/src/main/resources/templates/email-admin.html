<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}"></title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background:#f5f8fc; margin:0; padding:0; }
        .container { max-width:600px; margin:20px auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #6f42c1, #5936a0); color:white; padding:25px; text-align:center; }
        .content { padding:30px; line-height:1.7; color:#333; }
        .footer { background:#f8f9fa; padding:20px; text-align:center; font-size:13px; color:#6c757d; }
        .btn { display:inline-block; padding:12px 25px; background:#6f42c1; color:white; text-decoration:none; border-radius:6px; font-weight:500; }
        .highlight { background:#f3e8ff; padding:15px; border-left:4px solid #6f42c1; margin:20px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Admin Notification</h1>
    </div>

    <div class="content">
        <h2 th:text="${greeting}">Hello Admin,</h2>

        <p th:text="${message}"></p>

        <div class="highlight">
            <strong>Event:</strong> <span th:text="${eventType}"></span><br>
            <strong>Details:</strong> <span th:text="${details}"></span>
        </div>

        <a th:href="${buttonLink}" class="btn">View in Dashboard</a>
    </div>

    <div class="footer">
        © 2026 Appointment Management System<br>
        Pune, Maharashtra
    </div>
</div>
</body>
</html>
